<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Word Helper</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#111;color:#f7f7f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:720px;margin:auto;padding:18px 14px 40px} h1{font-size:24px;margin:0 0 4px}.sub{opacity:.65;font-size:13px;margin-bottom:16px}
    .card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:14px}
    .mics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mic{min-height:92px;border:0;border-radius:16px;font-weight:800;font-size:19px;padding:12px;cursor:pointer}
    .ja{background:#fff;color:#111}.en{background:#2b2b2b;color:#fff;border:1px solid #555}.mic small{display:block;font-size:12px;font-weight:500;margin-top:5px;opacity:.7}
    .listen{outline:3px solid #ff6b6b}.row{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:12px;padding:13px;font-size:18px}
    select,button.go{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:12px;padding:10px;font-size:15px}.go{font-weight:700}
    .result{min-height:92px;display:grid;place-items:center;text-align:center;font-size:clamp(34px,10vw,58px);font-weight:900;word-break:break-word;padding:8px}
    .source{text-align:center;opacity:.55;font-size:13px;min-height:20px}.status{text-align:center;font-size:13px;opacity:.7;min-height:20px;margin-top:4px}.error{color:#ffb4b4;opacity:1}
    .head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:18px;margin:0}.small{background:#292929;color:#fff;border:1px solid #444;border-radius:10px;padding:8px 10px}
    ul{list-style:none;padding:0;margin:10px 0 0}li{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:11px 0;border-top:1px solid #333;align-items:center}.arrow{opacity:.4}.empty{opacity:.5;grid-column:1/4}
  </style>
</head>
<body>
<main>
  <h1>Word Helper</h1>
  <div class="sub">会話を止めず、単語だけ素早く調べる</div>

  <section class="card">
    <div class="mics">
      <button id="jaMic" class="mic ja">🎤 日本語<small>→ English</small></button>
      <button id="enMic" class="mic en">🎤 English<small>→ 日本語</small></button>
    </div>

    <div class="row">
      <input id="word" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="文字でも入力できます">
      <select id="dir" aria-label="翻訳方向">
        <option value="ja-en">日→英</option>
        <option value="en-ja">英→日</option>
      </select>
      <button id="go" class="go">調べる</button>
    </div>

    <div id="result" class="result">—</div>
    <div id="source" class="source"></div>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <div class="head"><h2>単語帳</h2><button id="clear" class="small">履歴削除</button></div>
    <ul id="history"></ul>
  </section>
</main>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const word=$("word"),dir=$("dir"),go=$("go"),result=$("result"),source=$("source"),status=$("status"),historyEl=$("history"),jaMic=$("jaMic"),enMic=$("enMic");
  const KEY="word-helper-history-v1";
  let history=[];
  try{history=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{history=[]}

  function pair(){return dir.value==="ja-en"?{source:"ja",target:"en",speech:"ja-JP",label:"日本語 → English"}:{source:"en",target:"ja",speech:"en-US",label:"English → 日本語"}}
  function render(){historyEl.innerHTML="";if(!history.length){const li=document.createElement("li");li.innerHTML='<span class="empty">まだありません</span>';historyEl.appendChild(li);return}history.slice(0,50).forEach(x=>{const li=document.createElement("li"),a=document.createElement("span"),m=document.createElement("span"),b=document.createElement("span");a.textContent=x.src;m.textContent="→";m.className="arrow";b.textContent=x.dst;li.append(a,m,b);historyEl.appendChild(li)})}
  function save(src,dst){history.unshift({src,dst,at:Date.now()});history=history.slice(0,200);localStorage.setItem(KEY,JSON.stringify(history));render()}

  async function translate(){const q=word.value.trim();if(!q)return;const p=pair();go.disabled=true;status.className="status";status.textContent="翻訳中…";result.textContent="…";
    try{const r=await fetch("https://libretranslate.com/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q,source:p.source,target:p.target,format:"text",alternatives:1,api_key:""})});if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();const t=(data.translatedText||"").trim();if(!t)throw new Error("empty");result.textContent=t;source.textContent=q+"  ・  "+p.label;status.textContent="";save(q,t);word.select()}
    catch(e){console.error(e);result.textContent="翻訳できません";source.textContent=q;status.className="status error";status.textContent="無料翻訳サービスに接続できませんでした"}
    finally{go.disabled=false}}

  go.onclick=translate;word.addEventListener("keydown",e=>{if(e.key==="Enter")translate()});

  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  function listen(direction,button){dir.value=direction;if(!Recognition){status.className="status error";status.textContent="このブラウザは音声認識に対応していません";return}const rec=new Recognition();rec.lang=pair().speech;rec.interimResults=false;rec.maxAlternatives=1;button.classList.add("listen");status.className="status";status.textContent="聞いています…";rec.onresult=e=>{word.value=e.results[0][0].transcript.trim();translate()};rec.onerror=e=>{status.className="status error";status.textContent="音声認識: "+e.error};rec.onend=()=>button.classList.remove("listen");rec.start()}
  jaMic.onclick=()=>listen("ja-en",jaMic);enMic.onclick=()=>listen("en-ja",enMic);

  $("clear").onclick=()=>{if(confirm("単語帳の履歴をすべて削除しますか？")){history=[];localStorage.removeItem(KEY);render()}};
  render();
})();
</script>
</body>
</html>
